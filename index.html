<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Search App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .upload-area {
      border: 2px dashed #007aff;
      padding: 20px;
      border-radius: 12px;
      cursor: pointer;
      background: #f0f7ff;
      margin: 15px 0;
      display: block;
    }
    .upload-area input { display: none; }
    #preview {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin: 10px auto;
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .results {
      margin-top: 20px;
      text-align: left;
    }
    .result-item {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Profile Search</h2>
  <p style="color: #666; font-size: 14px;">Upload a photo to scan for online profiles</p>

  <label class="upload-area">
    <span>Tap to Choose Photo</span>
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)">
  </label>

  <img id="preview" alt="Preview" />

  <button onclick="performSearch()">Search Profiles</button>

  <div class="results" id="resultsContainer"></div>
</div>

<script>
  let base64Image = "";

  // Convert uploaded file to Base64 format
  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result;
        const preview = document.getElementById('preview');
        preview.src = base64Image;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }

  async function performSearch() {
    const resultsContainer = document.getElementById('resultsContainer');

    if (!base64Image) {
      alert("Please select a photo first!");
      return;
    }

    resultsContainer.innerHTML = "<p>Searching public profiles...</p>";

    try {
      // Calls Vercel API endpoint dynamically
      const response = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64Image })
      });

      const data = await response.json();

      if (data.success) {
        resultsContainer.innerHTML = "<h3>Found Links:</h3>";
        data.results.forEach(item => {
          resultsContainer.innerHTML += `
            <div class="result-item">
              <a href="${item.url}" target="_blank">${item.platform}</a>
              <span>${item.matchScore}</span>
            </div>
          `;
        });
      } else {
        resultsContainer.innerHTML = "<p>No matching profiles found.</p>";
      }
    } catch (err) {
      resultsContainer.innerHTML = "<p>Unable to connect to search service.</p>";
    }
  }
</script>

</body>
</html>
